<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Volve Field Water Analysis & Diagnostics</title>
    <!-- Stable CDN Libraries -->
    <script src="https://plot.ly"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { color: #003366; margin-bottom: 5px; }
        .subtitle { color: #555; margin-bottom: 25px; }
        .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        select, button { padding: 10px 14px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; background: white; cursor: pointer; }
        button { background: #003366; color: white; border: none; font-weight: bold; }
        button:hover { background: #002244; }
        .dashboard { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 200px; border-top: 4px solid #0066cc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #333; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card p { font-size: 20px; font-weight: bold; color: #003366; margin: 10px 0 0 0; }
        .plot-container { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<h1>Volve Field Water Analysis & Diagnostics</h1>
<div class="subtitle">Advanced Reservoir Water Breakthrough Analysis (Chan Diagnostics)</div>

<div class="controls">
    <div>
        <label><b>Select Well Bore:</b></label>
        <select id="wellSelector"></select>
    </div>
    <div>
        <label><b>Smoothing Trend:</b></label>
        <select id="smoothSelector">
            <option value="1">Raw Production Data</option>
            <option value="7">7-Day Moving Average</option>
            <option value="30">30-Day Moving Average</option>
        </select>
    </div>
    <div>
        <button id="exportBtn">💾 Export Processed CSV</button>
    </div>
</div>

<div class="dashboard">
    <div class="card"> <h3>Selected Well</h3> <p id="wellName">Loading...</p> </div>
    <div class="card"> <h3>Peak Water</h3> <p id="peakWater">-</p> </div>
    <div class="card"> <h3>Current Water</h3> <p id="currentWater">-</p> </div>
    <div class="card"> <h3>Cumulative Water</h3> <p id="cumWater">-</p> </div>
    <div class="card"> <h3>Current Water Cut</h3> <p id="currentWaterCut">-</p> </div>
    <div class="card"> <h3>Latest Field Water</h3> <p id="fieldWater">-</p> </div>
</div>

<div class="plot-container">
    <div id="prodPlot"></div>
</div>

<div class="plot-container">
    <div id="chanPlot"></div>
</div>

<script>
const SM3_TO_BBL = 6.2898;
let allRows = [];
let activeWellData = [];

Papa.parse("volvedatacsv.csv", {
    download: true,
    header: true,
    complete: function(results) {
        allRows = results.data.filter(row => row.NPD_WELL_BORE_NAME && row.DATEPRD);
        const wells = [...new Set(allRows.map(r => r.NPD_WELL_BORE_NAME))].sort();
        const selector = document.getElementById("wellSelector");
        
        wells.forEach(well => {
            const option = document.createElement("option");
            option.value = well; option.text = well;
            selector.appendChild(option);
        });

        calculateFieldKPIs();
        
        selector.addEventListener("change", function() { processAndRender(this.value); });
        document.getElementById("smoothSelector").addEventListener("change", function() { 
            processAndRender(document.getElementById("wellSelector").value); 
        });
        document.getElementById("exportBtn").addEventListener("click", exportCSVData);

        if(wells.length > 0) processAndRender(wells[0]);
    }
});

function calculateFieldKPIs(){
    const sortedDates = allRows.map(r => r.DATEPRD).filter(Boolean).sort();
    if (sortedDates.length === 0) return;
    const latestDate = sortedDates[sortedDates.length - 1];
    const latestRows = allRows.filter(r => r.DATEPRD === latestDate);
    const fieldWater = latestRows.reduce((sum, r) => sum + ((Number(r.BORE_WAT_VOL) || 0) * SM3_TO_BBL), 0);
    document.getElementById("fieldWater").innerText = fieldWater.toFixed(0) + " BWPD";
}

function movingAverage(data, windowSize) {
    let result = [];
    for (let i = 0; i < data.length; i++) {
        let start = Math.max(0, i - windowSize + 1);
        let end = i + 1;
        let sum = 0;
        for (let j = start; j < end; j++) { sum += data[j]; }
        result.push(sum / (end - start));
    }
    return result;
}

function processAndRender(wellName) {
    const rawWellData = allRows.filter(r => r.NPD_WELL_BORE_NAME === wellName)
                               .sort((a, b) => new Date(a.DATEPRD) - new Date(b.DATEPRD));
    if(rawWellData.length === 0) return;

    const windowSize = parseInt(document.getElementById("smoothSelector").value);
    
    // Convert units safely
    const dates = rawWellData.map(r => r.DATEPRD);
    const rawWater = rawWellData.map(r => (Number(r.BORE_WAT_VOL) || 0) * SM3_TO_BBL);
    const rawOil = rawWellData.map(r => (Number(r.BORE_OIL_VOL) || 0) * SM3_TO_BBL);

    // Apply Rolling Smoothing
    const water = movingAverage(rawWater, windowSize);
    const oil = movingAverage(rawOil, windowSize);

    // Dynamic Calculations
    const waterCut = water.map((w, i) => (oil[i] + w) > 0 ? (w / (oil[i] + w)) * 100 : 0);
    const totalWater = rawWater.reduce((sum, val) => sum + val, 0);
    let maxWater = Math.max(...rawWater);

    // Calculate Water-Oil Ratio (WOR) & WOR Derivative for Chan Log-Log Diagnostics
    const wor = [];
    const worDeriv = [];
    const timeStepDays = [];

    for(let i = 0; i < water.length; i++) {
        const currentWOR = oil[i] > 0 ? (water[i] / oil[i]) : 0;
        wor.push(currentWOR);
        timeStepDays.push(i + 1); // Days from production start

        // Simple backward difference numerical derivative d(WOR)/dt
        if (i > 0) {
            const dWOR = currentWOR - wor[i-1];
            worDeriv.push(dWOR > 0 ? dWOR : null); // Filter out negative noise for log scale plotting
        } else {
            worDeriv.push(null);
        }
    }

    // Save global state for the active CSV export
    activeWellData = dates.map((d, idx) => ({
        Date: d, WaterRate_BWPD: water[idx].toFixed(2), OilRate_BOPD: oil[idx].toFixed(2), WaterCut_Pct: waterCut[idx].toFixed(2), WOR: wor[idx].toFixed(4)
    }));

    // Render Metrics
    document.getElementById("wellName").innerText = wellName;
    document.getElementById("peakWater").innerText = maxWater.toFixed(0) + " BWPD";
    document.getElementById("currentWater").innerText = rawWater[rawWater.length - 1].toFixed(0) + " BWPD";
    document.getElementById("cumWater").innerText = (totalWater / 1000000).toFixed(2) + " MM bbls";
    document.getElementById("currentWaterCut").innerText = waterCut[waterCut.length - 1].toFixed(1) + " %";

    // Chart 1: Time Series Production History
    Plotly.newPlot("prodPlot", [
        { x: dates, y: water, name: "Water Rate (BWPD)", type: 'scatter', line: { color: "#0066cc", width: 2 } },
        { x: dates, y: waterCut, name: "Water Cut (%)", type: 'scatter', yaxis: "y2", line: { color: "#66ccff", width: 2, dash: "dash" } }
    ], {
        title: wellName + " Production History & Water Cut Trend",
        hovermode: "x unified",
        yaxis: { title: "Water Production Rate (BWPD)", titlefont: { color: "#0066cc" }, tickfont: { color: "#0066cc" } },
        yaxis2: { title: "Water Cut (%)", titlefont: { color: "#004488" }, tickfont: { color: "#004488" }, overlaying: "y", side: "right", range: [0, 100] }
    });

    // Chart 2: Chan Log-Log Diagnostics Plot
    Plotly.newPlot("chanPlot", [
        { x: timeStepDays, y: wor, name: "WOR", type: 'scatter', mode: 'lines', line: { color: "blue", width: 2 } },
        { x: timeStepDays, y: worDeriv, name: "WOR Derivative", type: 'scatter', mode: 'markers+lines', marker: { size: 4 }, line: { color: "red", width: 1.5, dash: 'dot' } }
    ], {
        title: wellName + " Water Breakthrough Diagnostics (Chan Log-Log Plot)",
        xaxis: { title: "Elapsed Production Time (Days)", type: 'log' },
        yaxis: { title: "WOR / WOR Derivative", type: 'log' }
    });
}

function exportCSVData() {
    if (activeWellData.length === 0) return alert("No operational well parameters generated yet!");
    const csvContent = "data:text/csv;charset=utf-8," 
        + ["Date,Water Rate (BWPD),Oil Rate (BOPD),Water Cut (%),WOR"].join(",") + "\n"
        + activeWellData.map(r => `${r.Date},${r.WaterRate_BWPD},${r.OilRate_BOPD},${r.WaterCut_Pct},${r.WOR}`).join("\n");
    
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `${document.getElementById("wellSelector").value}_processed_water_analysis.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
