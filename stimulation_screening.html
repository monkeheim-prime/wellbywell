<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Volve Field Well Stimulation Screening</title>
    <script src="https://plot.ly"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #003366;
            margin-top: 10px;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #hiPlot {
            width: 100%;
            height: 550px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #003366;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .priority-high {
            color: white;
            background-color: #d9534f;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            display: inline-block;
        }

        .priority-medium {
            color: #333;
            background-color: #f0ad4e;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            display: inline-block;
        }

        .priority-low {
            color: white;
            background-color: #5cb85c;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            display: inline-block;
        }
    </style>
</head>

<body>

<h1 id="pageTitle">Stimulation Screening & Heterogeneity Diagnostics</h1>

<div class="content-container">
    <div id="hiPlot"></div>

    <h2>Latest Production Period Snapshot Ranking</h2>
    <table>
        <thead>
            <tr>
                <th>Well Name</th>
                <th>Oil HI (Current)</th>
                <th>Water HI (Current)</th>
                <th>Diagnostic Status</th>
                <th>Priority Rank</th>
            </tr>
        </thead>
        <tbody id="rankingTableBody">
            <tr>
                <td colspan="5">Processing current period snapshot production records...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
Papa.parse("volvedatacsv.csv", {
    download: true,
    header: true,
    complete: function(results) {
        // Safe filter matching the main page logic exactly
        const cleanRows = results.data.filter(row => row.NPD_WELL_BORE_NAME && row.DATEPRD);
        
        if (cleanRows.length === 0) {
            document.getElementById("rankingTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">Error: No data records found.</td></tr>`;
            return;
        }

        // Identify the exact latest reporting timestamp date
        const sortedDates = cleanRows.map(r => r.DATEPRD).filter(Boolean).sort();
        const latestDate = sortedDates[sortedDates.length - 1];
        
        // Update page header to transparently display what date is currently being used for calculations
        document.getElementById("pageTitle").innerText = `Stimulation Screening & Diagnostics (${latestDate})`;

        // Isolate entries belonging strictly to this latest production date snapshot
        const latestRows = cleanRows.filter(r => r.DATEPRD === latestDate);

        let totalPeriodOil = 0;
        let totalPeriodWater = 0;
        let wellsSnapshotList = [];

        // Aggregate daily production parameters for the active well network
        latestRows.forEach(row => {
            const well = row.NPD_WELL_BORE_NAME;
            const oVol = Number(row.BORE_OIL_VOL) || 0;
            const wVol = Number(row.BORE_WAT_VOL) || 0;

            totalPeriodOil += oVol;
            totalPeriodWater += wVol;

            wellsSnapshotList.push({
                name: well,
                oil: oVol,
                water: wVol
            });
        });

        const activeCount = wellsSnapshotList.length;
        
        if (activeCount === 0) {
            document.getElementById("rankingTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">Error: No active wells on the latest date.</td></tr>`;
            return;
        }

        // Compute current period average baselines across the asset field map
        const avgFieldOil = totalPeriodOil / activeCount;
        const avgFieldWater = totalPeriodWater / activeCount;
        let processedData = [];

        wellsSnapshotList.forEach(well => {
            // HI = (Well Production on Date) / (Field Average Production on Date)
            const oHI = avgFieldOil > 0 ? (well.oil / avgFieldOil) : 0;
            const wHI = avgFieldWater > 0 ? (well.water / avgFieldWater) : 0;
            
            let status = "Good Performance", color = "green", priority = "Low", pClass = "priority-low";

            if (oHI < 1.0 && wHI > 1.0) {
                status = "Stimulation Candidate"; 
                color = "red";
                pClass = (wHI - oHI > 1.0) ? "priority-high" : "priority-medium";
                priority = (wHI - oHI > 1.0) ? "High" : "Medium";
            } else if (wHI < 1.0 && oHI > 1.0) {
                status = "Water Shut-Off Candidate"; 
                color = "blue";
            }

            processedData.push({ 
                name: well.name, 
                oilHI: oHI, 
                waterHI: wHI, 
                status: status, 
                color: color, 
                priority: priority, 
                priorityClass: pClass, 
                score: wHI - oHI 
            });
        });

        // Bubble top prioritization variances upward on display matrix tables
        processedData.sort((a, b) => b.score - a.score);

        const tbody = document.getElementById("rankingTableBody");
        tbody.innerHTML = "";
        
        let traces = {
            red: { x: [], y: [], text: [], mode: 'markers', name: 'Stimulation Candidate', marker: { color: 'red', size: 14, line: { color: 'white', width: 1 } } },
            blue: { x: [], y: [], text: [], mode: 'markers', name: 'Water Shut-off Candidate', marker: { color: 'blue', size: 14, line: { color: 'white', width: 1 } } },
            green: { x: [], y: [], text: [], mode: 'markers', name: 'Good Performance', marker: { color: 'green', size: 14, line: { color: 'white', width: 1 } } }
        };

        processedData.forEach(d => {
            let row = document.createElement("tr");
            row.innerHTML = `<td><b>${d.name}</b></td><td>${d.oilHI.toFixed(2)}</td><td>${d.waterHI.toFixed(2)}</td><td>${d.status}</td><td><span class="${d.priorityClass}">${d.priority}</span></td>`;
            tbody.appendChild(row);

            traces[d.color].x.push(d.oilHI);
            traces[d.color].y.push(d.waterHI);
            traces[d.color].text.push(d.name);
        });

        const plotDataTraces = [traces.red, traces.blue, traces.green].filter(t => t.x.length > 0);

        Plotly.newPlot('hiPlot', plotDataTraces, {
            title: `Heterogeneity Index Crossplot (${latestDate})`,
            xaxis: { title: 'Current Oil Heterogeneity Index (Oil HI)', autorange: true }, 
            yaxis: { title: 'Current Water Heterogeneity Index (Water HI)', autorange: true }, 
            hovermode: 'closest',
            shapes: [
                { type: 'line', x0: 0, y0: 0, x1: 4, y1: 4, line: { color: 'gray', width: 1, dash: 'dash' } },
                { type: 'line', x0: 1.0, y0: 0, x1: 1.0, y1: 4, line: { color: '#bbb', width: 1, dash: 'dot' } },
                { type: 'line', x0: 0, y0: 1.0, x1: 4, y1: 1.0, line: { color: '#bbb', width: 1, dash: 'dot' } }
            ]
        });
    }
});
</script>
</body>

</html>
