<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stimulation Candidate Screening</title>
    <script src="https://plot.ly"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { color: #003366; }
        select { padding: 8px; font-size: 14px; margin-bottom: 20px; }
        .dashboard { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .card h3 { margin-top: 0; color: #003366; }
        .flag-high { color: red; font-weight: bold; }
        .flag-normal { color: green; font-weight: bold; }
        #screeningPlot { background: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<h1>Well Stimulation Candidate Screening</h1>

<label><b>Select Asset Well Bores:</b></label>
<select id="wellSelector"></select>

<div class="dashboard">
    <div class="card">
        <h3>Selected Well</h3>
        <p id="wellName">Loading...</p>
    </div>
    <div class="card">
        <h3>Avg Downhole Pressure</h3>
        <p id="avgBHP">-</p>
    </div>
    <div class="card">
        <h3>Current Oil Rate</h3>
        <p id="currentOil">-</p>
    </div>
    <div class="card">
        <h3>Drawdown Status</h3>
        <p id="drawdownStatus">-</p>
    </div>
</div>

<div id="screeningPlot"></div>

<script>
const SM3_TO_BBL = 6.2898;
let allRows = [];

Papa.parse("volvedatacsv.csv", {
    download: true,
    header: true,
    complete: function(results) {
        allRows = results.data.filter(row => row.NPD_WELL_BORE_NAME && row.DATEPRD);
        const wells = [...new Set(allRows.map(r => r.NPD_WELL_BORE_NAME))].sort();
        const selector = document.getElementById("wellSelector");
        
        wells.forEach(well => {
            const option = document.createElement("option");
            option.value = well; option.text = well;
            selector.appendChild(option);
        });

        selector.addEventListener("change", function() { updateScreening(this.value); });
        if(wells.length > 0) updateScreening(wells[0]);
    }
});

function updateScreening(wellName) {
    const wellData = allRows.filter(r => r.NPD_WELL_BORE_NAME === wellName);
    if(wellData.length === 0) return;

    const dates = wellData.map(r => r.DATEPRD);
    const oilRate = wellData.map(r => (Number(r.BORE_OIL_VOL) || 0) * SM3_TO_BBL);
    const bhp = wellData.map(r => Number(r.AVG_DOWNHOLE_PRESSURE) || 0);

    // Calculate Latest KPI Metrics
    const latestBHP = bhp[bhp.length - 1];
    const latestOil = oilRate[oilRate.length - 1];

    document.getElementById("wellName").innerText = wellName;
    document.getElementById("avgBHP").innerText = latestBHP > 0 ? latestBHP.toFixed(1) + " Bar" : "N/A";
    document.getElementById("currentOil").innerText = latestOil.toFixed(0) + " bopd";

    const statusEl = document.getElementById("drawdownStatus");
    if (latestBHP > 0 && latestBHP < 150 && latestOil < 500) {
        statusEl.innerText = "HIGH CANDIDATE";
        statusEl.className = "flag-high";
    } else {
        statusEl.innerText = "Stable Baseline";
        statusEl.className = "flag-normal";
    }

    // Diagnostics Plot: Pressure vs Production Rate Over Time
    const oilTrace = { x: dates, y: oilRate, name: 'Oil Vol (bopd)', type: 'scatter', line: {color: 'green'} };
    const bhpTrace = { x: dates, y: bhp, name: 'BHP (Bar)', type: 'scatter', yaxis: 'y2', line: {color: 'red', dash: 'dot'} };

    Plotly.newPlot("screeningPlot", [oilTrace, bhpTrace], {
        title: wellName + " Diagnostic Screening Parameters",
        hovermode: "x unified",
        yaxis: { title: "Oil Production Vol (bopd)", titlefont: {color: 'green'}, tickfont: {color: 'green'} },
        yaxis2: { title: "Downhole Pressure (Bar)", titlefont: {color: 'red'}, tickfont: {color: 'red'}, overlaying: 'y', side: 'right' }
    });
}
</script>
</body>
</html>
