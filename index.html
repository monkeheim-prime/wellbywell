<!DOCTYPE html>
<html>
<head>
    <title>Volve Field Well Dashboard</title>
    <script src="https://plot.ly"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        .top-navbar { background-color: #002244; padding: 10px 20px; margin: -40px -40px 30px -40px; display: flex; gap: 10px; border-bottom: 4px solid #0055a5; }
        .nav-tab { color: #ffffff; text-decoration: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 6px 6px 0 0; background-color: #003366; transition: background 0.2s ease-in-out; }
        .nav-tab:hover { background-color: #0055a5; }
        .nav-tab.active { background-color: #f4f4f4; color: #003366; border-bottom: 4px solid #f4f4f4; margin-bottom: -14px; }
        h1 { color: #003366; margin-top: 10px; }
        select { padding: 8px; font-size: 14px; margin-bottom: 20px; }
        .dashboard { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .card h3 { margin-top: 0; }
        #prodPlot { background: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
<nav class="top-navbar">
    <a href="index.html" class="nav-tab active">Well Review</a>
    <a href="stimulation_screening.html" class="nav-tab">Stimulation Screening</a>
    <a href="water_analysis.html" class="nav-tab">Water Analysis</a>
</nav>
<h1>Volve Field Well Review</h1>
<label><b>Select Well:</b></label>
<select id="wellSelector"></select>
<div class="dashboard">
    <div class="card"><h3>Well</h3><p id="wellName">Loading...</p></div>
    <div class="card"><h3>Peak Oil</h3><p id="peakOil">-</p></div>
    <div class="card"><h3>Peak Water</h3><p id="peakWater">-</p></div>
    <div class="card"><h3>Peak Gas</h3><p id="peakGas">-</p></div>
    <div class="card"><h3>Current Oil</h3><p id="currentOil">-</p></div>
    <div class="card"><h3>Current Water</h3><p id="currentWater">-</p></div>
    <div class="card"><h3>Current Gas</h3><p id="currentGas">-</p></div>
    <div class="card"><h3>Field Oil</h3><p id="fieldOil">-</p></div>
    <div class="card"><h3>Field Water</h3><p id="fieldWater">-</p></div>
    <div class="card"><h3>Field Gas</h3><p id="fieldGas">-</p></div>
</div>
<div id="prodPlot"></div>

<script>
let globalData = {};
fetch('dashboard_data.json')
    .then(res => res.json())
    .then(data => {
        globalData = data;
        document.getElementById("fieldOil").innerText = data.fieldKPIs.fieldOil;
        document.getElementById("fieldWater").innerText = data.fieldKPIs.fieldWater;
        document.getElementById("fieldGas").innerText = data.fieldKPIs.fieldGas;

        const selector = document.getElementById("wellSelector");
        data.wellsList.forEach(well => {
            let opt = document.createElement("option");
            opt.value = well; opt.text = well; selector.appendChild(opt);
        });

        selector.addEventListener("change", e => updateWellDashboard(e.target.value));
        if(data.wellsList.length > 0) updateWellDashboard(data.wellsList[0]);
    });

function updateWellDashboard(wellName) {
    const well = globalData.wellsHistorical[wellName];
    document.getElementById("wellName").innerText = wellName;
    document.getElementById("peakOil").innerText = well.peakOil;
    document.getElementById("peakWater").innerText = well.peakWater;
    document.getElementById("peakGas").innerText = well.peakGas;
    document.getElementById("currentOil").innerText = well.currentOil;
    document.getElementById("currentWater").innerText = well.currentWater;
    document.getElementById("currentGas").innerText = well.currentGas;

    Plotly.newPlot("prodPlot", [
        { x: well.dates, y: well.oil, name: "Oil (BOPD)", line: { color: "green" } },
        { x: well.dates, y: well.water, name: "Water (BWPD)", line: { color: "blue" } },
        { x: well.dates, y: well.gas, name: "Gas (MMSCFD)", yaxis: "y2", line: { color: "orange" } }
    ], {
        title: wellName + " Production Overview", hovermode: "x unified",
        yaxis: { title: "Liquid Rate" }, yaxis2: { title: "Gas Rate", overlaying: "y", side: "right" }
    });
}
</script>
</body>
</html>
