<!DOCTYPE html>
<html>
<head>
    <title>Volve Well Review</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #003366;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        img {
            max-width: 100%;
            border: 1px solid #ddd;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<h1>Volve Field Well Review</h1>

<div class="dashboard">
    <div class="card">
        <h3>Well</h3>
        <p>15/9-F-1 C</p>
    </div>

    <div class="card">
        <h3>Peak Oil</h3>
        <p>6,000 BOPD</p>
    </div>

    <div class="card">
        <h3>Peak Water</h3>
        <p>6,200 BWPD</p>
    </div>

    <div class="card">
        <h3>Peak Gas</h3>
        <p>0.20 MMSCFD</p>
    </div>
</div>

<h2>Production Overview</h2>

<p>This is a prototype Volve well surveillance dashboard.</p>

</body>
</html>
