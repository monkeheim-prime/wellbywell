<head>
    <title>Volve Well Review</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        ...
    </style>
</head>

<script>

let allRows = [];

Papa.parse("volvedatacsv.csv", {

    download: true,
    header: true,

    complete: function(results) {

        allRows = results.data;

        const wells = [
            ...new Set(
                allRows
                    .map(row => row.NPD_WELL_BORE_NAME)
                    .filter(Boolean)
            )
        ].sort();

        const selector =
            document.getElementById(
                "wellSelector"
            );

        selector.innerHTML = "";

        wells.forEach(well => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = well;
            option.text = well;

            selector.appendChild(
                option
            );

        });

        selector.addEventListener(
            "change",
            function() {

                updateDashboard(
                    this.value
                );

            }
        );

        updateDashboard(
            wells[0]
        );

    }

});

function updateDashboard(wellName){

    const wellData = allRows.filter(
        row =>
        row.NPD_WELL_BORE_NAME
        === wellName
    );

    if(wellData.length === 0){
        return;
    }

    const oil = wellData.map(
        row => Number(row.BORE_OIL_VOL) || 0
    );

    const water = wellData.map(
        row => Number(row.BORE_WAT_VOL) || 0
    );

    const gas = wellData.map(
        row => Number(row.BORE_GAS_VOL) || 0
    );

    const dates = wellData.map(
        row => row.DATEPRD
    );

    document.getElementById(
        "wellName"
    ).innerText = wellName;

    document.getElementById(
        "peakOil"
    ).innerText =
        Math.max(...oil).toFixed(0)
        + " Sm³/d";

    document.getElementById(
        "peakWater"
    ).innerText =
        Math.max(...water).toFixed(0)
        + " Sm³/d";

    document.getElementById(
        "peakGas"
    ).innerText =
        Math.max(...gas).toFixed(0)
        + " Sm³/d";

    Plotly.newPlot(
        "prodPlot",
        [

            {
                x: dates,
                y: oil,
                name: "Oil Rate",
                line: {
                    color: "green"
                }
            },

            {
                x: dates,
                y: water,
                name: "Water Rate",
                line: {
                    color: "blue"
                }
            },

            {
                x: dates,
                y: gas,
                name: "Gas Rate",
                yaxis: "y2",
                line: {
                    color: "orange"
                }
            }

        ],

        {

            title:
                "Production Overview - "
                + wellName,

            yaxis: {
                title:
                    "Oil / Water Rate"
            },

            yaxis2: {
                title:
                    "Gas Rate",
                overlaying: "y",
                side: "right"
            }

        }

    );

}

</script>
