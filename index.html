<!DOCTYPE html>
<html>
<head>
    <title>Volve Well Review</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #003366;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        #prodPlot {
            background: white;
            border-radius: 10px;
            min-height: 500px;
            padding: 10px;
        }

        select {
            padding: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h1>Volve Field Well Review</h1>

<label><b>Select Well:</b></label>

<select id="wellSelector">
</select>

<div class="dashboard">

    <div class="card">
        <h3>Well</h3>
        <p id="wellName">15/9-F-1 C</p>
    </div>

    <div class="card">
        <h3>Peak Oil</h3>
        <p id="peakOil">6000 BOPD</p>
    </div>

    <div class="card">
        <h3>Peak Water</h3>
        <p id="peakWater">6200 BWPD</p>
    </div>

    <div class="card">
        <h3>Peak Gas</h3>
        <p id="peakGas">0.20 MMSCFD</p>
    </div>

</div>

<h2>Production Overview</h2>

<div id="prodPlot"></div>

<script>

const data = {

    F1: {

        name: "15/9-F-1 C",

        peakOil: "6000 BOPD",

        peakWater: "6200 BWPD",

        peakGas: "0.20 MMSCFD",

        oil: [6000, 5500, 5000, 4500, 4000],

        water: [100, 300, 700, 1200, 1800],

        gas: [0.10, 0.12, 0.14, 0.17, 0.20]

    },

    F11: {

        name: "15/9-F-11 B",

        peakOil: "4500 BOPD",

        peakWater: "3000 BWPD",

        peakGas: "0.15 MMSCFD",

        oil: [4500, 4200, 3900, 3400, 3100],

        water: [500, 700, 1200, 1800, 2500],

        gas: [0.08, 0.09, 0.11, 0.13, 0.15]

    }

};

function updateDashboard(well) {

    document.getElementById("wellName").innerText =
        data[well].name;

    document.getElementById("peakOil").innerText =
        data[well].peakOil;

    document.getElementById("peakWater").innerText =
        data[well].peakWater;

    document.getElementById("peakGas").innerText =
        data[well].peakGas;

    var oilTrace = {
        x: [1,2,3,4,5],
        y: data[well].oil,
        name: "Oil Rate",
        line: {color:"green"}
    };

    var waterTrace = {
        x: [1,2,3,4,5],
        y: data[well].water,
        name: "Water Rate",
        line: {color:"blue"}
    };

    var gasTrace = {
        x: [1,2,3,4,5],
        y: data[well].gas,
        name: "Gas Rate",
        yaxis: "y2",
        line: {color:"orange"}
    };

    Plotly.newPlot(
        'prodPlot',
        [oilTrace, waterTrace, gasTrace],
        {
            title: 'Production Overview',

            yaxis: {
                title: 'Liquid Rate (BOPD/BWPD)'
            },

            yaxis2: {
                title: 'Gas Rate (MMSCFD)',
                overlaying: 'y',
                side: 'right'
            }
        }
    );
}

document.getElementById("wellSelector")
.addEventListener("change", function() {

    updateDashboard(this.value);

});

updateDashboard("F1");

</script>

</body>
</html>
