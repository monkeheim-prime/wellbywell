<!DOCTYPE html>
<html>

<head>

    <title>Volve Field Well Dashboard</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        /* Top Navigation Tabs Styling */
        .top-navbar {
            background-color: #002244;
            padding: 10px 20px;
            margin: -40px -40px 30px -40px; /* Counteracts body margins to span full width */
            display: flex;
            gap: 10px;
            border-bottom: 4px solid #0055a5;
        }

        .nav-tab {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px 6px 0 0;
            background-color: #003366;
            transition: background 0.2s ease-in-out;
        }

        .nav-tab:hover {
            background-color: #0055a5;
        }

        .nav-tab.active {
            background-color: #f4f4f4;
            color: #003366;
            border-bottom: 4px solid #f4f4f4;
            margin-bottom: -14px; /* Blends cleanly into background */
        }

        h1 {
            color: #003366;
            margin-top: 10px;
        }

        select {
            padding: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .card h3 {
            margin-top: 0;
        }

        #prodPlot {
            background: white;
            border-radius: 8px;
            padding: 10px;
        }

    </style>

</head>

<body>

<!-- Top Navigation Tabs -->
<nav class="top-navbar">
    <a href="index.html" class="nav-tab active">Well Review</a>
    <a href="stimulation_screening.html" class="nav-tab">Stimulation Screening</a>
    <a href="water_analysis.html" class="nav-tab">Water Analysis</a>
</nav>

<h1>Volve Field Well Review</h1>

<label><b>Select Well:</b></label>

<select id="wellSelector"></select>

<div class="dashboard">

    <div class="card">
        <h3>Well</h3>
        <p id="wellName">Loading...</p>
    </div>

    <div class="card">
        <h3>Peak Oil</h3>
        <p id="peakOil">-</p>
    </div>

    <div class="card">
        <h3>Peak Water</h3>
        <p id="peakWater">-</p>
    </div>

    <div class="card">
        <h3>Peak Gas</h3>
        <p id="peakGas">-</p>
    </div>

    <div class="card">
        <h3>Current Oil</h3>
        <p id="currentOil">-</p>
    </div>

    <div class="card">
        <h3>Current Water</h3>
        <p id="currentWater">-</p>
    </div>

    <div class="card">
        <h3>Current Gas</h3>
        <p id="currentGas">-</p>
    </div>

    <div class="card">
        <h3>Field Oil</h3>
        <p id="fieldOil">-</p>
    </div>

    <div class="card">
        <h3>Field Water</h3>
        <p id="fieldWater">-</p>
    </div>

    <div class="card">
        <h3>Field Gas</h3>
        <p id="fieldGas">-</p>
    </div>

</div>

<div id="prodPlot"></div>

<script>

const SM3_TO_BBL = 6.2898;
const SM3_TO_SCF = 35.3147;

let allRows = [];

Papa.parse("volvedatacsv.csv", {

    download: true,
    header: true,

    complete: function(results) {

        allRows = results.data.filter(
            row => row.NPD_WELL_BORE_NAME
        );

        const wells = [
            ...new Set(
                allRows.map(
                    r => r.NPD_WELL_BORE_NAME
                )
            )
        ].sort();

        const selector =
            document.getElementById(
                "wellSelector"
            );

        selector.innerHTML = "";

        wells.forEach(well => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = well;
            option.text = well;

            selector.appendChild(
                option
            );

        });

        calculateFieldKPIs();

        selector.addEventListener(
            "change",
            function() {

                updateWell(
                    this.value
                );

            }
        );

        if(wells.length > 0){

            updateWell(wells[0]); // Verified array element execution here

        }

    }

});

function calculateFieldKPIs(){

    const latestDate = allRows
        .map(r => r.DATEPRD)
        .filter(Boolean)
        .sort()
        .slice(-1)[0];

    const latestRows =
        allRows.filter(
            r => r.DATEPRD === latestDate
        );

    const fieldOil =
        latestRows.reduce(
            (sum,r) =>
            sum +
            ((Number(r.BORE_OIL_VOL)||0)
            * SM3_TO_BBL),
            0
        );

    const fieldWater =
        latestRows.reduce(
            (sum,r) =>
            sum +
            ((Number(r.BORE_WAT_VOL)||0)
            * SM3_TO_BBL),
            0
        );

    const fieldGas =
        latestRows.reduce(
            (sum,r) =>
            sum +
            ((Number(r.BORE_GAS_VOL)||0)
            * SM3_TO_SCF
            / 1000000),
            0
        );

    document.getElementById(
        "fieldOil"
    ).innerText =
        fieldOil.toFixed(0)
        + " BOPD";

    document.getElementById(
        "fieldWater"
    ).innerText =
        fieldWater.toFixed(0)
        + " BWPD";

    document.getElementById(
        "fieldGas"
    ).innerText =
        fieldGas.toFixed(2)
        + " MMSCFD";

}

function updateWell(wellName){

    const wellData =
        allRows.filter(
            r =>
            r.NPD_WELL_BORE_NAME
            === wellName
        );

    if(wellData.length === 0){
        return;
    }

    const dates =
        wellData.map(
            r => r.DATEPRD
        );

    const oil =
        wellData.map(
            r =>
            (Number(r.BORE_OIL_VOL)||0)
            * SM3_TO_BBL
        );

    const water =
        wellData.map(
            r =>
            (Number(r.BORE_WAT_VOL)||0)
            * SM3_TO_BBL
        );

    const gas =
        wellData.map(
            r =>
            (Number(r.BORE_GAS_VOL)||0)
            * SM3_TO_SCF
            / 1000000
        );

    document.getElementById(
        "wellName"
    ).innerText =
        wellName;

    document.getElementById(
        "peakOil"
    ).innerText =
        Math.max(...oil).toFixed(0)
        + " BOPD";

    document.getElementById(
        "peakWater"
    ).innerText =
        Math.max(...water).toFixed(0)
        + " BWPD";

    document.getElementById(
        "peakGas"
    ).innerText =
        Math.max(...gas).toFixed(2)
        + " MMSCFD";

    document.getElementById(
        "currentOil"
    ).innerText =
        oil[oil.length-1].toFixed(0)
        + " BOPD";

    document.getElementById(
        "currentWater"
    ).innerText =
        water[water.length-1].toFixed(0)
        + " BWPD";

    document.getElementById(
        "currentGas"
    ).innerText =
        gas[gas.length-1].toFixed(2)
        + " MMSCFD";

    const oilTrace = {

        x: dates,
        y: oil,
        name: "Oil Rate (BOPD)",
        line: {
            color: "green"
        }

    };

    const waterTrace = {

        x: dates,
        y: water,
        name: "Water Rate (BWPD)",
        line: {
            color: "blue"
        }

    };

    const gasTrace = {

        x: dates,
        y: gas,
        name: "Gas Rate (MMSCFD)",
        yaxis: "y2",
        line: {
            color: "orange"
        }

    };

    Plotly.newPlot(

        "prodPlot",

        [
            oilTrace,
            waterTrace,
            gasTrace
        ],

        {

            title:
                wellName
                + " Production Overview",

            hovermode:
                "x unified",

            yaxis: {
                title:
                    "Liquid Rate (BOPD / BWPD)"
            },

            yaxis2: {
                title:
                    "Gas Rate (MMSCFD)",
                overlaying:
                    "y",
                side:
                    "right"
            }

        }

    );

}

</script>

</body>
</html>
